name: Validate all-cancer atlas pipeline

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "pipeline/**"
      - ".github/workflows/**"
  push:
    branches:
      - "feature/all-cancer-atlas-pipeline"

concurrency:
  group: validate-atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruct and verify archive
        run: bash pipeline/reconstruct.sh

      - name: Extract source
        run: |
          rm -rf pipeline/src
          mkdir -p pipeline/src
          unzip -q pipeline/all_cancer_atlas_pipeline.zip -d pipeline/src
          echo "ATLAS_ROOT=pipeline/src/all_cancer_atlas_pipeline" >> "$GITHUB_ENV"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e "$ATLAS_ROOT"

      - name: Compile Python sources
        run: python -m compileall -q "$ATLAS_ROOT/src"

      - name: Run unit tests
        working-directory: ${{ env.ATLAS_ROOT }}
        run: pytest -q

      - name: Initialize empty atlas database
        working-directory: ${{ env.ATLAS_ROOT }}
        run: cancer-atlas init
